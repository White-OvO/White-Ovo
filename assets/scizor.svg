<svg viewBox="0 0 460 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated Scizor-inspired mascot">
  <defs>
    <radialGradient id="sglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A9FEF7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#A9FEF7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- floating sparkles -->
  <path d="M58 50 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 z" fill="#FE428E" opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;0.25;0.85" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M404 62 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#A9FEF7" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 8; 0 0" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.1s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <circle cx="230" cy="130" r="90" fill="url(#sglow)"/>

  <g id="character">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3.4s" calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- wings (behind body), fast buzz -->
    <g fill="#C9D6E2" opacity="0.55">
      <path d="M204 96 C170 80 150 60 148 34 C176 44 200 64 210 92 Z">
        <animateTransform attributeName="transform" type="rotate" values="-4 204 96; 4 204 96; -4 204 96" dur="0.18s" repeatCount="indefinite"/>
      </path>
      <path d="M256 96 C290 80 310 60 312 34 C284 44 260 64 250 92 Z">
        <animateTransform attributeName="transform" type="rotate" values="4 256 96; -4 256 96; 4 256 96" dur="0.18s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- tail prongs -->
    <g fill="#EDEFF3">
      <polygon points="212,214 202,246 224,218">
        <animateTransform attributeName="transform" type="rotate" values="-4 212 214; 4 212 214; -4 212 214" dur="2.4s" repeatCount="indefinite"/>
      </polygon>
      <polygon points="248,214 258,246 236,218">
        <animateTransform attributeName="transform" type="rotate" values="4 248 214; -4 248 214; 4 248 214" dur="2.4s" begin="0.3s" repeatCount="indefinite"/>
      </polygon>
    </g>

    <!-- abdomen -->
    <ellipse cx="230" cy="192" rx="36" ry="28" fill="#B7B9C4"/>
    <path d="M204 186 Q230 196 256 186" fill="none" stroke="#8D8F9C" stroke-width="3" stroke-linecap="round"/>
    <path d="M208 202 Q230 212 252 202" fill="none" stroke="#8D8F9C" stroke-width="3" stroke-linecap="round"/>

    <!-- torso -->
    <ellipse cx="230" cy="140" rx="54" ry="46" fill="#D6301A"/>
    <ellipse cx="214" cy="120" rx="18" ry="12" fill="#F1614A" opacity="0.5"/>

    <!-- left claw -->
    <g>
      <path d="M186 128 C150 108 108 112 78 132 C112 118 148 122 176 140 Z" fill="#D6301A" stroke="#8A1A0C" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-6 186 128;-6 186 128;14 186 128;-6 186 128" keyTimes="0;0.55;0.65;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M186 128 C150 148 110 150 82 136 C114 158 152 156 178 138 Z" fill="#B8230F" stroke="#7A1509" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="6 186 128;6 186 128;-14 186 128;6 186 128" keyTimes="0;0.55;0.65;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- right claw (mirrored) -->
    <g>
      <path d="M274 128 C310 108 352 112 382 132 C348 118 312 122 284 140 Z" fill="#D6301A" stroke="#8A1A0C" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="6 274 128;6 274 128;-14 274 128;6 274 128" keyTimes="0;0.55;0.65;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <path d="M274 128 C310 148 350 150 378 136 C346 158 308 156 282 138 Z" fill="#B8230F" stroke="#7A1509" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" values="-6 274 128;-6 274 128;14 274 128;-6 274 128" keyTimes="0;0.55;0.65;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- head -->
    <polygon points="230,42 220,58 240,58" fill="#B8230F"/>
    <circle cx="230" cy="86" r="34" fill="#D6301A"/>
    <path d="M214 62 C206 50 202 40 206 30" fill="none" stroke="#B8230F" stroke-width="4" stroke-linecap="round"/>
    <path d="M246 62 C254 50 258 40 254 30" fill="none" stroke="#B8230F" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="230" cy="92" rx="22" ry="16" fill="#C9CBD6"/>
    <ellipse cx="219" cy="90" rx="5.5" ry="4" fill="#7A0E05"/>
    <ellipse cx="241" cy="90" rx="5.5" ry="4" fill="#7A0E05"/>
  </g>
</svg>
